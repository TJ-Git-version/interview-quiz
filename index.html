<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>面试题库</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="tabs">
      <button class="tab active" data-tab="list">题库</button>
      <button class="tab" data-tab="practice">练习</button>
      <button class="tab" data-tab="stats">统计</button>
      <button class="tab" data-tab="history">历史</button>
    </div>
  </header>

  <main>
    <section id="view-list" class="view"></section>
    <section id="view-practice" class="view hidden"></section>
    <section id="view-stats" class="view hidden"></section>
    <section id="view-history" class="view hidden"></section>
  </main>

  <footer class="foot">本地题库 · 进度存在本机浏览器</footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
  <button id="settings-btn" class="fab" aria-label="设置">⚙️</button>
  <div id="settings-mask" class="mask hidden"></div>
  <div id="settings-sheet" class="sheet hidden">
    <div class="sheet-title">设置</div>
    <div class="sheet-label">主题</div>
    <div class="sheet-options">
      <button class="theme-opt" data-theme="light">☀️ 浅色</button>
      <button class="theme-opt" data-theme="dark">🌙 深色</button>
    </div>
    <div class="sheet-label">云同步（GitHub）</div>
    <input id="sync-repo" class="input" placeholder="仓库 owner/repo，如 TJ-Git-version/interview-quiz-data" />
    <input id="sync-token" class="input" type="password" placeholder="GitHub 令牌（建议 fine-grained，仅此仓库 contents 权限）" />
    <div class="sheet-actions">
      <button id="sync-save" class="btn primary">保存</button>
      <button id="sync-now" class="btn">立即同步</button>
    </div>
    <div id="sync-status" class="sync-status"></div>
    <button id="close-settings" class="btn primary">完成</button>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
