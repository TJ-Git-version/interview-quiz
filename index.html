<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>面试题库</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="tabs">
      <button class="tab active" data-tab="list">题库</button>
      <button class="tab" data-tab="practice">练习</button>
      <button class="tab" data-tab="stats">统计</button>
      <button class="tab" data-tab="history">历史</button>
    </div>
  </header>

  <main>
    <section id="view-list" class="view"></section>
    <section id="view-practice" class="view hidden"></section>
    <section id="view-stats" class="view hidden"></section>
    <section id="view-history" class="view hidden"></section>
  </main>

  <footer class="foot">本地题库 · 进度存在本机浏览器</footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
